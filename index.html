<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08273c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Maran Toolbox"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Maran Toolbox Pro</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9f5fc;background:#071a2b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b3047,#071a2b 60%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:#092b40;position:sticky;top:0;z-index:5;border-bottom:1px solid #244c62}header .wrap{max-width:1100px;margin:auto;padding:11px 17px;display:flex;align-items:center;gap:13px}.brand{width:55px;height:42px;object-fit:contain;background:#e8e8e8;border-radius:6px;padding:3px}.brandtext{flex:1}.brandtext strong{display:block;font-size:18px}.brandtext small{color:#a4c3d2}.shell{max-width:1100px;margin:0 auto;padding:18px 16px 60px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 15px}.tabs button{white-space:nowrap;background:#14394e;color:#bcd4df;border-radius:9px;padding:10px 13px}.tabs button.active,.primary{background:#28bcae!important;color:#062733!important;font-weight:750}.panel{background:#102f44;border:1px solid #285169;border-radius:16px;padding:18px;margin-bottom:15px}.muted{color:#aac3d1}.small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:#74e2d5;font-weight:700}h1{font-size:25px;margin:6px 0 9px}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.tile{background:#143c53;color:#f1faff;text-align:left;border:1px solid #2d5a6c;border-radius:14px;padding:17px;min-height:115px}.tile strong{display:block;margin:7px 0}.tile span{font-size:12px;color:#b3d0dc}.tile:disabled{opacity:.57;cursor:not-allowed}.tag{display:inline-block;background:#174f59;color:#8ff3df;border-radius:20px;padding:4px 9px;font-size:12px}.btn{background:#1c5067;color:#effaff;border-radius:9px;padding:10px 13px;margin:3px 4px 3px 0}.btn.primary{background:#28bcae}.btn.danger{background:#643541}.btn.outline{background:transparent;border:1px solid #4a7688}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;color:#b5d1df}.field input,.field select,.field textarea,.search{background:#082539;color:#f0f8fb;border:1px solid #406477;border-radius:9px;padding:11px;width:100%;min-width:0}.field textarea{min-height:85px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 14px}.listrow{display:flex;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid #31546a}.listrow>div{flex:1}.listrow small{display:block;color:#a6c1d0;margin-top:4px}.listrow input[type=checkbox]{width:20px;height:20px;accent-color:#25c5b1}.notice{background:#173f50;border-left:3px solid #55cdbc;padding:12px;border-radius:8px;color:#c7e3ec;margin:12px 0}.warning{border-left-color:#f5c06d}.hidden{display:none!important}.back{margin-bottom:12px}.empty{padding:25px;text-align:center;color:#aac4d2}.status{font-size:12px;border-radius:20px;padding:4px 9px;background:#4c422d;color:#ffe4a0}.status.done{background:#1d4c43;color:#a6f3c5}.photo{width:100%;max-width:240px;border-radius:8px;margin:5px}.iframe{width:100%;min-height:820px;border:0;border-radius:12px;background:#071a2b}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:115px;background:#153c50;padding:14px;border-radius:10px}.stat strong{font-size:24px;display:block}.footer{text-align:center;color:#91b1c0;font-size:12px;margin-top:30px}.divider{border:0;border-top:1px solid #2b5266;margin:15px 0}.help{background:#163d53;padding:14px;border-radius:10px;margin-top:12px}.help summary{cursor:pointer;font-weight:700;color:#9be9dd}.help p,.help li{color:#c2d9e5;font-size:13px;line-height:1.55}@media(max-width:600px){.shell{padding:12px}.panel{padding:14px}.brandtext strong{font-size:16px}.iframe{min-height:760px}}@media print{header,.tabs,.btn,.no-print{display:none!important}body{background:white;color:black}.panel{background:white;color:black;border:1px solid #bbb}.muted,.small{color:#333}.shell{max-width:none}}
 .shiphero{width:100%;height:clamp(175px,30vw,330px);object-fit:cover;object-position:center 54%;display:block;border-radius:13px;margin:0 0 16px}.heroCaption{font-size:12px;color:#a4c3d2;margin:-9px 0 14px} </style></head><body><header><div class="wrap"><img src="mtm-logo.png" class="brand" alt="MTM logo"><div class="brandtext"><strong>Maran Toolbox Pro</strong><small>Fleet tools · Vessel history · Offline</small></div><span id="headVessel" class="tag">Set up</span></div></header><main class="shell"><div id="tabs" class="tabs hidden"></div><div id="app"></div><div class="footer">Created by <b>Capt. Dimitrios G. Karakasilis</b> · Marine Superintendent<br>Prototype · Locally stored records · Not an official MTM system</div></main><input id="importFile" type="file" accept=".json,.mtb,application/json" hidden><script>
const FLEET=["MARAN AJAX", "MARAN ANTIOPE", "MARAN APHRODITE", "MARAN APOLLO", "MARAN ARCTURUS", "MARAN ARES", "MARAN ARETE", "MARAN ARIADNE", "MARAN ARTEMIS", "MARAN ASPASIA", "MARAN ASTERIA", "MARAN ATALANTA", "MARAN ATHENA", "MARAN ATLAS", "MARAN AURA", "MARAN CLEO", "MARAN DANAE", "MARAN DIONE", "MARAN HELEN", "MARAN HELIOS", "MARAN HERCULES", "MARAN HERMES", "MARAN HERMIONE", "MARAN HOMER", "MARAN LEO", "MARAN LIBRA", "MARAN LYNX", "MARAN MAIA", "MARAN MARS", "MARAN MELINA", "MARAN MENELAUS", "MARAN MIRA", "MARAN MORPHEUS", "MARAN MUSE", "MARAN MYRON", "MARAN MYRSINI", "MARAN MYRTO", "MARAN ORPHEUS", "MARAN PENELOPE", "MARAN PHOEBE", "MARAN PLATO", "MARAN POSEIDON", "MARAN PYTHIA", "MARAN SOLON", "MARAN TAURUS", "MARAN THALEIA", "MARAN THETIS", "MARIA A. ANGELICOUSSIS", "SOPHIA"];const KEY='maran-toolbox-v1';const fresh=()=>({version:1,role:'',active:'',watch:[],records:[],projects:[],notes:[],vesselData:{},importHistory:[],budgets:[],supplies:[],changeLog:[],profile:{name:'',fleet:'A'}});let db;try{db={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=fresh()}let page='home',editId=null,search='',selectedProject='',importPayload=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));const now=()=>new Date().toISOString();const date=s=>s?new Date(s).toLocaleDateString('en-GB'):'';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage is full. Export a backup, then reduce photo sizes. '+e.message);return false}};const button=(text,action,cls='')=>`<button class="btn ${cls}" onclick="${action}">${text}</button>`;const help=(title,body)=>`<details class="help"><summary>ⓘ ${title}</summary>${body}</details>`;const roleLabel=()=>db.role==='officer'?'Vessel Officer':'Marine Superintendent';function go(p){page=p;editId=null;search='';render();window.scrollTo(0,0)}function setRole(r){db.role=r;save();go('fleet')}function setActive(v){db.active=v;save();go('home')}function setTab(){const items=[['home','⌂ Home'],['fleet','⚓ My vessels'],['jobs','🔧 Maintenance'],['projects','🛠 Drydock'],['history','▤ History'],['budgets','€ Budgets'],['supplies','⚓ Supplies'],['activity','🔔 Activity'],['changes','⇧ Share changes'],['transfer','⇄ Handover'],['help','? Help'],['settings','⚙ Settings']];$('tabs').innerHTML=items.map(([p,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('');$('tabs').classList.remove('hidden')}
function render(){const root=$('app');$('headVessel').textContent=db.active||'No vessel';if(!db.role){$('tabs').classList.add('hidden');root.innerHTML=`<section class="panel"><img class="shiphero" src="maran-morpheus.jpg" alt="MARAN MORPHEUS at sea"><div class="heroCaption">MARAN MORPHEUS · MTM Fleet</div><span class="eyebrow">WELCOME ABOARD</span><h1>Choose your role</h1><p class="muted">Your selection determines how you manage Maran vessels. You can change it later.</p><div class="grid"><button class="tile" onclick="setRole('officer')"><div style="font-size:27px">⚓</div><strong>Vessel Officer</strong><span>Work with one assigned vessel</span></button><button class="tile" onclick="setRole('superintendent')"><div style="font-size:27px">▤</div><strong>Marine Superintendent</strong><span>Create a watchlist of multiple vessels</span></button></div></section>`;return}setTab();if(page==='fleet')root.innerHTML=fleetPage();else if(page==='home')root.innerHTML=homePage();else if(page==='eta')root.innerHTML=`<div class="panel"><h2>ETA & Required Speed Calculator</h2><p class="muted small">Existing Marine ETA calculator. Results are not automatically saved to the vessel history.</p>${button('← Dashboard',"go('home')")}</div><iframe class="iframe" title="Marine ETA Calculator" src="eta.html"></iframe>`;else if(page==='jobs')root.innerHTML=jobsPage();else if(page==='jobform')root.innerHTML=jobForm();else if(page==='projects')root.innerHTML=projectsPage();else if(page==='projectform')root.innerHTML=projectForm();else if(page==='history')root.innerHTML=historyPage();else if(page==='transfer')root.innerHTML=transferPage();else if(page==='importpreview')root.innerHTML=importPreview();else if(page==='budgets')root.innerHTML=budgetPage();else if(page==='supplies')root.innerHTML=supplyPage();else if(page==='changes')root.innerHTML=changesPage();else if(page==='activity')root.innerHTML=activityPage();else if(page==='help')root.innerHTML=helpPage();else if(page==='settings')root.innerHTML=settingsPage();else if(page==='converter')root.innerHTML=converterPage();else root.innerHTML=homePage()}
function fleetPage(){const choices=db.role==='officer'?db.active?[db.active]:[]:db.watch;const list=FLEET.filter(v=>v.toLowerCase().includes(search.toLowerCase()));return `<section class="panel"><span class="eyebrow">${esc(roleLabel())}</span><h1>${db.role==='officer'?'Select your vessel':'My fleet watchlist'}</h1><p class="muted">${db.role==='officer'?'Choose the ship on which you serve.':'Choose the ships you monitor. You can change this list at any time.'}</p><div class="stats"><div class="stat"><strong>${choices.length}</strong><span class="small muted">Selected vessels</span></div><div class="stat"><strong>${FLEET.length}</strong><span class="small muted">Fleet entries</span></div></div><div class="field"><label>Search vessels</label><input class="search" id="fleetSearch" placeholder="Type vessel name" value="${esc(search)}" oninput="search=this.value;updateFleetList()"></div><div id="fleetList">${fleetRows(list)}</div></section>`}
function fleetRows(list){return list.map(v=>{let on=db.role==='officer'?db.active===v:db.watch.includes(v);return `<div class="listrow"><input type="${db.role==='officer'?'radio':'checkbox'}" name="fleet" ${on?'checked':''} onchange="toggleVessel('${v}',this.checked)"><div><b>${esc(v)}</b>${db.active===v?'<small>Currently active</small>':''}</div>${db.watch.includes(v)||db.active===v?button('Open',`setActive('${v}')`,'outline'):''}</div>`}).join('')||'<div class="empty">No matching vessels</div>'}function updateFleetList(){$('fleetList').innerHTML=fleetRows(FLEET.filter(v=>v.toLowerCase().includes(search.toLowerCase())))}function toggleVessel(v,on){if(db.role==='officer'){db.active=v;db.watch=[v]}else{db.watch=on?[...new Set([...db.watch,v])]:db.watch.filter(x=>x!==v);if(on&&!db.active)db.active=v;if(!on&&db.active===v)db.active=db.watch[0]||''}save();render()}
function needVessel(){if(db.active)return '';return `<section class="panel"><h2>Choose a vessel first</h2><p class="muted">Select a vessel from your fleet list to work with its records.</p>${button('Select vessel',"go('fleet')",'primary')}</section>`}
function homePage(){if(!db.active)return needVessel();const jobs=db.records.filter(r=>r.vessel===db.active),pending=jobs.filter(r=>r.status!=='Completed').length,pro=db.projects.filter(r=>r.vessel===db.active).length;const tools=[['⏱','ETA & Speed','Original calculator','eta'],['⇄','Unit Converter','Pressure, volume and distance','converter'],['🔧','Maintenance','Jobs, photos and status','jobs'],['🛠','Drydock Projects','Repairs and progress','projects'],['▤','Vessel History','Past work and records','history'],['📦','Export & Import','Handover and backups','transfer'],['€','Annual Budgets','5-year history and forecast','budgets'],['⚓','Supply Register','Orders, deliveries and tails','supplies'],['🔔','Activity Center','Changes and audit history','activity'],['⇧','Share Updates','Export selected changes','changes']];const upcoming=[['⚓','Mooring Brake Test'],['◉','Cargo Operations'],['⛽','Fuel & ROB'],['◷','Speed & Fuel Optimizer'],['☑','Inspection Tracker'],['〰','Mooring Register'],['⚙','COW Planner']];return `<section class="panel"><img class="shiphero" src="maran-morpheus.jpg" alt="MARAN MORPHEUS at sea"><span class="eyebrow">${esc(roleLabel())} DASHBOARD</span><h1>${esc(db.active)}</h1><div class="stats"><div class="stat"><strong>${jobs.length}</strong><span class="small muted">Maintenance jobs</span></div><div class="stat"><strong>${pending}</strong><span class="small muted">Open jobs</span></div><div class="stat"><strong>${pro}</strong><span class="small muted">Drydock projects</span></div></div><div style="margin-top:12px">${button('Switch vessel',"go('fleet')")}${button('Add maintenance job',"editId=null;go('jobform')",'primary')}</div></section><section class="panel"><h2>Available tools</h2><div class="grid">${tools.map(([ic,t,d,p])=>`<button class="tile" onclick="go('${p}')"><div style="font-size:25px">${ic}</div><strong>${t}</strong><span>${d}</span></button>`).join('')}</div></section><section class="panel"><h2>Planned modules</h2><p class="small muted">These are not yet implemented. Safety-critical calculations will be released only after verification.</p><div class="grid">${upcoming.map(([ic,t])=>`<button class="tile" disabled><div style="font-size:25px">${ic}</div><strong>${t}</strong><span>Coming in a future update</span></button>`).join('')}</div></section>`}
function jobsPage(){if(!db.active)return needVessel();const rows=db.records.filter(r=>r.vessel===db.active).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));return `<section class="panel"><span class="eyebrow">${esc(db.active)}</span><h1>Maintenance & Defects</h1><p class="muted">Jobs, status, dates, remarks and photographs are saved against this vessel.</p>${button('+ New job',"editId=null;go('jobform')",'primary')}${button('Print report',"window.print()")}${rows.length?rows.map(r=>`<div class="listrow"><div><b>${esc(r.title)}</b><small>${esc(r.area||'General')} · ${esc(r.project||'No project')} · Updated ${date(r.updated)}</small><small>${esc(r.remarks||'')}</small>${r.photo?`<img class="photo" src="${r.photo}" alt="Job photo">`:''}</div><span class="status ${r.status==='Completed'?'done':''}">${esc(r.status)}</span>${button('Edit',`editId='${r.id}';go('jobform')`,'outline')}</div>`).join(''):'<div class="empty">No maintenance jobs recorded yet.</div>'}</section>`}
function jobForm(){if(!db.active)return needVessel();const r=db.records.find(x=>x.id===editId)||{};return `<section class="panel">${button('← Back',"go('jobs')") }<h1>${editId?'Edit':'New'} maintenance job</h1><form id="jobForm" onsubmit="submitJob(event)"><div class="formgrid"><div class="field"><label>Job / defect description *</label><input name="title" required value="${esc(r.title||'')}"></div><div class="field"><label>Area / equipment</label><input name="area" placeholder="e.g. Main deck / IGS" value="${esc(r.area||'')}"></div><div class="field"><label>Drydock project</label><select name="project"><option value="">Not assigned</option>${db.projects.filter(x=>x.vessel===db.active).map(x=>`<option ${r.project===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option ${r.status==='Pending'?'selected':''}>Pending</option><option ${r.status==='In Progress'?'selected':''}>In Progress</option><option ${r.status==='Completed'?'selected':''}>Completed</option></select></div><div class="field"><label>Target date</label><input name="due" type="date" value="${esc(r.due||'')}"></div><div class="field"><label>Completion date</label><input name="completed" type="date" value="${esc(r.completed||'')}"></div></div><div class="field"><label>Remarks / work done / recommendations</label><textarea name="remarks">${esc(r.remarks||'')}</textarea></div><div class="field"><label>Attach photo (compressed for offline storage)</label><input name="photo" type="file" accept="image/*"><small class="muted">${r.photo?'A photo is already saved. Select another to replace it.':'Photos increase backup size. Export regularly.'}</small></div><button class="btn primary" type="submit">Save job</button>${editId?button('Delete job',`deleteJob('${r.id}')`,'danger'):''}</form>${help('Recording maintenance','<p>Use one job per equipment item or repair. Add the exact location, date and remarks. Keep original inspection and approval records separately. A completed job remains in the vessel history.</p>')}</section>`}
async function submitJob(e){e.preventDefault();const f=e.target,fd=new FormData(f),old=db.records.find(x=>x.id===editId),r={...(old||{}),id:old?.id||id(),vessel:db.active,created:old?.created||now(),updated:now()};for(const k of ['title','area','project','status','due','completed','remarks'])r[k]=String(fd.get(k)||'').trim();const file=f.elements.photo.files[0];if(file){if(!file.type.startsWith('image/')){alert('Please select an image.');return}r.photo=await shrink(file)}if(old)db.records=db.records.map(x=>x.id===old.id?r:x);else db.records.push(r);if(save())go('jobs')}
function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image cannot be read'))};img.src=url})}function deleteJob(rid){if(!confirm('Delete this maintenance job permanently from this device?'))return;db.records=db.records.filter(x=>x.id!==rid);save();go('jobs')}
function projectsPage(){if(!db.active)return needVessel();const rows=db.projects.filter(r=>r.vessel===db.active).sort((a,b)=>(b.start||'').localeCompare(a.start||''));return `<section class="panel"><span class="eyebrow">${esc(db.active)}</span><h1>Drydock & Repair Projects</h1>${button('+ New project',"editId=null;go('projectform')",'primary')}${rows.length?rows.map(r=>{const jobs=db.records.filter(x=>x.vessel===db.active&&x.project===r.name),done=jobs.filter(x=>x.status==='Completed').length;return `<div class="listrow"><div><b>${esc(r.name)}</b><small>${esc(r.location||'Location not set')} · ${esc(r.start||'')} to ${esc(r.end||'')}</small><small>${jobs.length} jobs · ${done} completed</small><small>${esc(r.notes||'')}</small></div>${button('Edit',`editId='${r.id}';go('projectform')`,'outline')}</div>`}).join(''):'<div class="empty">No drydock projects recorded.</div>'}</section>`}
function projectForm(){const r=db.projects.find(x=>x.id===editId)||{};return `<section class="panel">${button('← Back',"go('projects')")}<h1>${editId?'Edit':'New'} drydock project</h1><form onsubmit="submitProject(event)" id="projectForm"><div class="field"><label>Project name *</label><input name="name" required placeholder="e.g. Yiulian Shekou Drydock 2026" value="${esc(r.name||'')}"></div><div class="formgrid"><div class="field"><label>Shipyard / location</label><input name="location" value="${esc(r.location||'')}"></div><div class="field"><label>Start date</label><input type="date" name="start" value="${esc(r.start||'')}"></div><div class="field"><label>End date</label><input type="date" name="end" value="${esc(r.end||'')}"></div></div><div class="field"><label>Project summary / recommendations</label><textarea name="notes">${esc(r.notes||'')}</textarea></div><button class="btn primary" type="submit">Save project</button>${editId?button('Delete project',`deleteProject('${r.id}')`,'danger'):''}</form></section>`}function submitProject(e){e.preventDefault();const fd=new FormData(e.target),old=db.projects.find(x=>x.id===editId),r={...(old||{}),id:old?.id||id(),vessel:db.active,created:old?.created||now(),updated:now()};for(const k of ['name','location','start','end','notes'])r[k]=String(fd.get(k)||'').trim();if(old){db.records.forEach(j=>{if(j.vessel===db.active&&j.project===old.name)j.project=r.name});db.projects=db.projects.map(x=>x.id===old.id?r:x)}else db.projects.push(r);save();go('projects')}function deleteProject(rid){if(!confirm('Delete project? Associated jobs will remain, but may no longer be linked to a project.'))return;db.projects=db.projects.filter(x=>x.id!==rid);save();go('projects')}
function historyPage(){if(!db.active)return needVessel();const jobs=db.records.filter(r=>r.vessel===db.active).sort((a,b)=>(b.completed||b.updated||'').localeCompare(a.completed||a.updated||''));return `<section class="panel"><span class="eyebrow">${esc(db.active)}</span><h1>Vessel Maintenance History</h1><p class="muted">Historical work remains visible after completion and can be transferred to another user.</p><div class="field"><label>Search jobs, areas and remarks</label><input id="historySearch" oninput="filterHistory(this.value)" placeholder="e.g. isolating valve, mooring winch"></div><div id="historyRows">${historyRows(jobs)}</div></section>`}function historyRows(jobs){return jobs.length?jobs.map(r=>`<div class="listrow"><div><b>${esc(r.title)}</b><small>${date(r.completed||r.updated)} · ${esc(r.area)} · ${esc(r.project)}</small><small>${esc(r.remarks)}</small>${r.photo?`<img class="photo" src="${r.photo}">`:''}</div><span class="status ${r.status==='Completed'?'done':''}">${esc(r.status)}</span></div>`).join(''):'<div class="empty">No matching history.</div>'}function filterHistory(q){const s=q.toLowerCase();$('historyRows').innerHTML=historyRows(db.records.filter(r=>r.vessel===db.active&&[r.title,r.area,r.remarks,r.project].join(' ').toLowerCase().includes(s)).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')))}
function transferPage(){if(!db.active)return needVessel();return `<section class="panel"><span class="eyebrow">TRANSFER & HANDOVER</span><h1>Export and Import</h1><p class="muted">Share maintenance, budgets, supply orders and vessel history with another Superintendent, or make an offline backup.</p><div class="notice">Exports contain maintenance history, remarks and any attached photos. Only share with authorized colleagues through approved channels.</div><h3>Export</h3><div class="field"><label>Export scope</label><select id="exportScope"><option value="vessel">Current vessel: ${esc(db.active)}</option><option value="all">All locally saved vessels (personal backup)</option></select></div>${button('Export transferable data file',"exportData()",'primary')}${button('Print vessel history',"go('history');setTimeout(()=>window.print(),150)")}<hr class="divider"><h3>Import</h3><p class="muted small">Imports use record identifiers to identify duplicates. Conflicting updates are kept as separate review copies, not silently overwritten.</p>${button('Choose data file to import',"$('importFile').click()",'primary')}${help('How handover works','<p>On the old device, export the vessel history. Send the file to an authorized colleague. On the receiving device, open Import, inspect the vessel and record counts, then confirm. Existing records are preserved.</p><p>Data remains on each device. This is not a live fleet synchronization service. Back up regularly and check imported information before operational use.</p>')}</section>`}
function download(name,data){const b=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportData(){const scope=$('exportScope').value,vessels=scope==='all'?[...new Set([...db.watch,db.active,...db.records.map(x=>x.vessel),...db.projects.map(x=>x.vessel)])].filter(Boolean):[db.active];const payload={budgets:(db.budgets||[]).filter(x=>vessels.includes(x.vessel)),supplies:(db.supplies||[]).filter(x=>vessels.includes(x.vessel)),changeLog:(db.changeLog||[]).filter(x=>vessels.includes(x.vessel)),format:'maran-toolbox-handover',schemaVersion:1,exportedAt:now(),vessels,records:db.records.filter(x=>vessels.includes(x.vessel)),projects:db.projects.filter(x=>vessels.includes(x.vessel)),notes:db.notes.filter(x=>vessels.includes(x.vessel)),source:'Maran Toolbox Pro'};download(`Maran_Toolbox_${scope==='all'?'Backup':db.active.replaceAll(' ','_')}_${new Date().toISOString().slice(0,10)}.mtb`,JSON.stringify(payload));alert('Export prepared. Keep this file in a secure location.')}function readImport(e){const f=e.target.files[0];if(!f)return;if(f.size>35*1024*1024){alert('File exceeds 35 MB. Split into smaller exports.');return}const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(p.format!=='maran-toolbox-handover'||p.schemaVersion!==1||!Array.isArray(p.records)||!Array.isArray(p.projects)||!Array.isArray(p.vessels))throw Error('Not a supported Maran Toolbox export');if([...p.records,...p.projects].some(r=>!r.id||!r.vessel))throw Error('Incomplete record data');importPayload=p;go('importpreview')}catch(err){alert('Import failed: '+err.message)}};reader.readAsText(f);e.target.value=''}
function compare(arr,existing){let add=0,same=0,conflict=0;for(const r of arr){const old=existing.find(x=>x.id===r.id);if(!old)add++;else if(JSON.stringify(old)===JSON.stringify(r))same++;else conflict++}return {add,same,conflict}}function importPreview(){if(!importPayload)return transferPage();const p=importPayload,rc=compare(p.records,db.records),pc=compare(p.projects,db.projects),bc=compare(p.budgets||[],db.budgets||[]),sc=compare(p.supplies||[],db.supplies||[]);return `<section class="panel"><span class="eyebrow">IMPORT PREVIEW</span><h1>Review incoming vessel records</h1><p class="muted">Export date: ${date(p.exportedAt)} · Vessels: ${p.vessels.map(esc).join(', ')}</p><div class="stats"><div class="stat"><strong>${rc.add+pc.add+bc.add+sc.add}</strong><span class="small muted">New records</span></div><div class="stat"><strong>${rc.same+pc.same+bc.same+sc.same}</strong><span class="small muted">Unchanged duplicates</span></div><div class="stat"><strong>${rc.conflict+pc.conflict+bc.conflict+sc.conflict}</strong><span class="small muted">Conflicting versions</span></div></div><div class="notice warning">Incoming conflicting records will be saved as separate copies marked “Imported version — review”. Original records will not be overwritten.</div>${button('Confirm import',"confirmImport()",'primary')}${button('Cancel',"importPayload=null;go('transfer')",'outline')}</section>`}
function merge(arr,incoming){let added=0,conflicts=0;for(const r of incoming){const old=arr.find(x=>x.id===r.id);if(!old){arr.push(r);added++}else if(JSON.stringify(old)!==JSON.stringify(r)){const copy={...r,id:id(),originalId:r.id,importConflict:true,remarks:((r.remarks||'')+'\n[Imported version — review against existing record]').trim()};arr.push(copy);conflicts++}}return {added,conflicts}}function confirmImport(){const p=importPayload;if(!p)return;const a=merge(db.projects,p.projects),b=merge(db.records,p.records);const c=merge(db.budgets,p.budgets||[]),d=merge(db.supplies,p.supplies||[]);merge(db.changeLog,p.changeLog||[]);for(const v of p.vessels){if(FLEET.includes(v)&&db.role==='superintendent'&&!db.watch.includes(v))db.watch.push(v)}db.importHistory.push({when:now(),vessels:p.vessels,count:a.added+b.added+c.added+d.added,conflicts:a.conflicts+b.conflicts+c.conflicts+d.conflicts});if(!db.active&&p.vessels[0])db.active=p.vessels[0];if(save()){importPayload=null;alert(`Import completed: ${a.added+b.added+c.added+d.added} new records, ${a.conflicts+b.conflicts+c.conflicts+d.conflicts} review copies.`);go('history')}}
function converterPage(){return `<section class="panel"><h1>Marine Unit Converter</h1><div class="formgrid"><div class="field"><label>Value</label><input id="cv" type="number" value="1" step="any" oninput="convert()"></div><div class="field"><label>Conversion</label><select id="ct" onchange="convert()"><option value="nmkm">Nautical miles → km</option><option value="kmnm">km → Nautical miles</option><option value="knkm">Knots → km/h</option><option value="kmkn">km/h → Knots</option><option value="barpsi">bar → psi</option><option value="psibar">psi → bar</option><option value="barkpa">bar → kPa</option><option value="kpabar">kPa → bar</option><option value="barmm">bar → mmH₂O</option><option value="mmbar">mmH₂O → bar</option><option value="m3bbl">m³ → US petroleum barrels</option><option value="bblm3">US petroleum barrels → m³</option></select></div></div><div class="stat"><strong id="convertResult">1.852</strong><span class="small muted">Converted result</span></div>${help('Conversion references','<p>1 nautical mile = 1.852 km; 1 knot = 1.852 km/h; 1 bar = 100 kPa; 1 bar ≈ 14.5037738 psi; 1 bar ≈ 10,197.162 mmH₂O (standard gravity); 1 m³ ≈ 6.28981077 US petroleum barrels.</p><p>Use the correct temperature, density and calibration references for cargo measurements. This converter is not a certified custody-transfer instrument.</p>')}</section>`}function convert(){const factors={nmkm:1.852,kmnm:1/1.852,knkm:1.852,kmkn:1/1.852,barpsi:14.5037738,psibar:1/14.5037738,barkpa:100,kpabar:.01,barmm:10197.16213,mmbar:1/10197.16213,m3bbl:6.28981077,bblm3:1/6.28981077};const v=Number($('cv').value);$('convertResult').textContent=Number.isFinite(v)?(v*factors[$('ct').value]).toLocaleString('en-US',{maximumFractionDigits:6}):'—'}
function helpPage(){return `<section class="panel"><h1>Help Center</h1><p class="muted">Help is stored inside the app and available offline.</p>${help('Getting started','<p>Select Vessel Officer to work on one vessel or Marine Superintendent to manage a watchlist. Choose the active vessel before recording jobs.</p>')}${help('Changing vessels','<p>Open My vessels, change the selected ships, then tap Open. Your records remain linked to their original vessels.</p>')}${help('Maintenance and drydock','<p>Create a drydock project, then add maintenance jobs and assign them to that project. Record the equipment location, status, dates, findings and work completed. Photos are optional.</p>')}${help('ETA and time zones','<p>Open ETA & Speed to access the original calculator. Check departure and arrival time zones independently. Confirm calculated voyage duration and speed against the approved voyage plan.</p>')}${help('Export, import and backup','<p>Export one vessel or all vessel records to a .mtb file. Import on another device to merge new records. Conflicts are preserved as review copies. Regular backups are essential because browser data may be cleared.</p>')}${help('Safety and limitations','<p>This is an independent prototype and is not connected to company systems. Vessel information is user-entered or based on a historical fleet list. All technical calculations and reports must be checked against approved vessel manuals, company procedures and current regulations.</p>')}</section>`}
function settingsPage(){return `<section class="panel"><h1>Settings</h1><h3>Local profile (not an online account)</h3><div class="field"><label>Your name</label><input id="profileName" value="${esc(db.profile?.name||'')}" placeholder="Full name"></div><div class="field"><label>Fleet</label><select id="profileFleet">${['A','B','C'].map(f=>`<option ${db.profile?.fleet===f?'selected':''}>${f}</option>`).join('')}</select></div>${button('Save local profile',"saveProfile()",'primary')}<hr class="divider"><p class="muted">Role: <b>${esc(roleLabel())}</b></p>${button('Change role',"changeRole()")}${button('Manage watchlist',"go('fleet')")}${button('Export backup',"go('transfer')",'primary')}<hr class="divider"><h3>Local data</h3><p class="small muted">Records are stored in this browser on this device. Clearing site data or uninstalling the browser can erase them. Export backups regularly.</p>${button('Erase all local data',"eraseAll()",'danger')}${help('Privacy','<p>This prototype does not transmit records to a server. Exported files may contain photos and operational information; handle them according to your company rules. The MTM logo and vessel data should only be used in authorized internal contexts.</p>')}</section>`}function saveProfile(){db.profile={name:$('profileName').value.trim(),fleet:$('profileFleet').value};save();alert('Local profile saved. This is not phone-number login or verified access.')}function changeRole(){if(!confirm('Change your role? Existing records will remain.'))return;db.role='';save();render()}function eraseAll(){if(!confirm('This permanently deletes ALL local records. Have you exported a backup?'))return;if(!confirm('Final confirmation: erase all data?'))return;localStorage.removeItem(KEY);db=fresh();page='home';render()}

// v1.1 modules: offline budgets, supply orders and selective change handovers.
db.budgets ||= []; db.supplies ||= []; db.changeLog ||= [];
const money=n=>Number(n||0).toLocaleString('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:2});
function logChange(kind,rec,summary,previous){db.changeLog.push({id:id(),vessel:rec.vessel,kind,recordId:rec.id,summary,when:now(),shared:false,author:db.profile?.name||'Local user',before:previous||null,after:JSON.parse(JSON.stringify(rec))});save();if(confirm('Saved. Export this update for your partner now? (Automatic notifications need a connected service.)'))go('changes')}
function activityPage(){const items=db.changeLog.filter(x=>db.role==='superintendent'?db.watch.includes(x.vessel)||x.vessel===db.active:x.vessel===db.active).sort((a,b)=>b.when.localeCompare(a.when));return `<section class="panel"><span class="eyebrow">CHANGE HISTORY · THIS DEVICE</span><h1>Fleet Activity Center</h1><p class="muted">A chronological record of changes saved on this device or imported from colleagues. Automatic cross-device alerts are not connected yet.</p>${button('Export updates',"go('changes')",'primary')}${items.length?items.map(x=>`<div class="listrow"><div style="width:100%"><b>${esc(x.vessel)} · ${esc(x.kind)}</b><small>${esc(x.summary)}</small><small>${esc(x.author||'Unknown')} · ${esc(new Date(x.when).toLocaleString('en-GB'))} · ${x.shared?'Exported':'Not exported'}</small>${x.before?`<details class="help"><summary>See what changed</summary>${diffFields(x.before,x.after||{})}</details>`:''}</div></div>`).join(''):'<div class="empty">No changes recorded yet.</div>'}</section>`}
function diffFields(before,after){const keys=[...new Set([...Object.keys(before||{}),...Object.keys(after||{})])].filter(k=>!['updated','created','id','photo'].includes(k)&&JSON.stringify(before[k])!==JSON.stringify(after[k]));return keys.length?keys.map(k=>`<p class="small"><b>${esc(k)}</b>: ${esc(String(before[k]??'—').slice(0,180))} → ${esc(String(after[k]??'—').slice(0,180))}</p>`).join(''):'<p class="small">Previous record differs only in metadata.</p>'}

function budgetPage(){if(!db.active)return needVessel();const y=Number(window.budgetYear||new Date().getFullYear()+1),cat=window.budgetCat||'Paints',v=db.active;const vals=Array.from({length:5},(_,i)=>y-5+i),rows=vals.map(year=>db.budgets.find(x=>x.vessel===v&&x.year===year&&x.category===cat));const actual=rows.map(x=>x?.actual).filter(x=>x!==''&&x!=null).map(Number),avg=actual.length?actual.reduce((a,b)=>a+b,0)/actual.length:null;const current=db.budgets.find(x=>x.vessel===v&&x.year===y&&x.category===cat)||{};return `<section class="panel"><span class="eyebrow">FLEET FINANCE · ${esc(v)}</span><h1>Annual Budget & 5-Year History</h1><div class="notice">Historical amounts are not prefilled from Excel. Enter verified figures or import them later. Missing years are shown as missing, never zero.</div><div class="formgrid"><div class="field"><label>Budget year</label><select onchange="window.budgetYear=Number(this.value);render()">${Array.from({length:12},(_,i)=>2025+i).map(z=>`<option ${z===y?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>Category</label><select onchange="window.budgetCat=this.value;render()">${['Paints','Mooring Wires','Mooring Tails','Mooring Ropes','Lifeboat Wires','Accommodation Ladder Wires','Other'].map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select></div></div><h3>Previous 5 years</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Year</th><th>Approved budget</th><th>Actual</th><th>Variance</th></tr></thead><tbody>${vals.map((z,i)=>`<tr style="border-top:1px solid #31546a"><td>${z}</td><td>${rows[i]?.approved!==''&&rows[i]?.approved!=null?money(rows[i].approved):'Not recorded'}</td><td>${rows[i]?.actual!==''&&rows[i]?.actual!=null?money(rows[i].actual):'Not recorded'}</td><td>${rows[i]?.approved!==''&&rows[i]?.approved!=null&&rows[i]?.actual!==''&&rows[i]?.actual!=null?money(Number(rows[i].actual)-Number(rows[i].approved)):'—'}</td></tr>`).join('')}</tbody></table></div><div class="stats" style="margin-top:15px"><div class="stat"><span class="small muted">Average of ${actual.length} available actual years</span><strong>${avg==null?'—':money(avg)}</strong></div><div class="stat"><span class="small muted">Recorded years</span><strong>${actual.length} / 5</strong></div></div><hr class="divider"><h3>Edit ${y} ${esc(cat)} budget</h3><form onsubmit="saveBudget(event)"><div class="formgrid"><div class="field"><label>Approved budget (€)</label><input name="approved" type="number" min="0" step="0.01" value="${esc(current.approved??'')}"></div><div class="field"><label>Actual expenditure (€)</label><input name="actual" type="number" min="0" step="0.01" value="${esc(current.actual??'')}"></div><div class="field"><label>Proposed budget (€)</label><input name="proposed" type="number" min="0" step="0.01" value="${esc(current.proposed??'')}"></div><div class="field"><label>Status</label><select name="status">${['Draft','For review','Approved','Revised'].map(x=>`<option ${current.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Justification / planned work / extraordinary drydock expenses</label><textarea name="remarks">${esc(current.remarks||'')}</textarea></div><button class="btn primary" type="submit">Save budget and offer to share</button></form>${help('Five-year comparison','<p>For a 2027 budget, compare 2022–2026. Missing years remain blank. The average uses available actual expenditures only. Separate normal operating costs from exceptional drydock spending. Always check source figures and currency before approval.</p>')}</section>`}
function saveBudget(e){e.preventDefault();const y=Number(window.budgetYear||new Date().getFullYear()+1),category=window.budgetCat||'Paints',fd=new FormData(e.target);let r=db.budgets.find(x=>x.vessel===db.active&&x.year===y&&x.category===category);if(!r){r={id:id(),vessel:db.active,year:y,category,created:now()};db.budgets.push(r)}const previous=r.updated?JSON.parse(JSON.stringify(r)):null;for(const k of ['approved','actual','proposed','status','remarks'])r[k]=String(fd.get(k)||'').trim();r.updated=now();save();logChange('Budget',r,`${category} ${y}: proposed ${r.proposed?money(r.proposed):'not entered'}; ${r.status}`,previous);render()}
function supplyPage(){if(!db.active)return needVessel();const items=db.supplies.filter(x=>x.vessel===db.active).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));return `<section class="panel"><span class="eyebrow">VESSEL SUPPLIES · ${esc(db.active)}</span><h1>Equipment & Delivery Register</h1><form onsubmit="saveSupply(event)"><div class="formgrid"><div class="field"><label>Equipment / item *</label><input name="item" required placeholder="Mooring tails"></div><div class="field"><label>Quantity *</label><input name="qty" required type="number" min="0.01" step="any"></div><div class="field"><label>Unit</label><select name="unit"><option>pcs</option><option>sets</option><option>metres</option><option>kg</option></select></div><div class="field"><label>Status</label><select name="status">${['Requested','Approved','Ordered','Supply arranged','Dispatched','Delivered','Received onboard','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Expected delivery</label><input type="date" name="eta"></div><div class="field"><label>Reference / purchase order</label><input name="reference"></div></div><div class="field"><label>Remarks</label><textarea name="remarks"></textarea></div><button class="btn primary" type="submit">Save and offer to share</button></form><hr class="divider"><h3>Recorded supplies (${items.length})</h3>${items.length?items.map(r=>`<div class="listrow"><div><b>${esc(r.item)}</b> · ${esc(r.qty)} ${esc(r.unit)}<small>${esc(r.status)} · ${esc(r.eta||'No delivery date')} · ${esc(r.reference||'')}</small><small>${esc(r.remarks||'')}</small></div>${button('Update',`updateSupply('${r.id}')`)}</div>`).join(''):'<div class="empty">No supply entries for this vessel.</div>'}${help('Sharing and delivery status','<p>Each saved supply entry can be exported to another Superintendent. Offline export is available now; automatic cloud synchronization is not yet connected. Statuses must be updated manually.</p>')}</section>`}
function saveSupply(e){e.preventDefault();const f=new FormData(e.target),r={id:id(),vessel:db.active,created:now(),updated:now()};for(const k of ['item','qty','unit','status','eta','reference','remarks'])r[k]=String(f.get(k)||'').trim();db.supplies.push(r);save();logChange('Supply',r,`${r.qty} ${r.unit} ${r.item}: ${r.status}`,previous);render()}
function updateSupply(rid){const r=db.supplies.find(x=>x.id===rid);if(!r)return;const statuses=['Requested','Approved','Ordered','Supply arranged','Dispatched','Delivered','Received onboard','Cancelled'];const result=prompt('Update status for '+r.item+'\n'+statuses.map((s,i)=>`${i+1}. ${s}`).join('\n')+'\nEnter number:',String(Math.max(1,statuses.indexOf(r.status)+1)));if(result===null)return;const idx=Number(result)-1;if(!Number.isInteger(idx)||idx<0||idx>=statuses.length){alert('Invalid status number');return}const previous=JSON.parse(JSON.stringify(r));r.status=statuses[idx];r.updated=now();save();logChange('Supply',r,`${r.qty} ${r.unit} ${r.item}: ${r.status}`,previous);render()}
function changesPage(){const changes=db.changeLog.filter(x=>db.role==='superintendent'?db.watch.includes(x.vessel)||x.vessel===db.active:x.vessel===db.active).sort((a,b)=>b.when.localeCompare(a.when));return `<section class="panel"><span class="eyebrow">OFFLINE SHARING · SELECT RECIPIENT MANUALLY</span><h1>Fleet Change Queue</h1><p class="muted">Select changes to share with another Superintendent. The recipient imports the .mtb file in Handover. Nothing is transmitted automatically. Choose the recipient in your phone’s email or messaging app after exporting.</p><div class="notice warning">Real-time synchronization, accounts, access control and notifications require a separate secure server. They are not enabled in this browser version.</div><div>${changes.map(x=>`<div class="listrow"><input type="checkbox" class="sharecheck" value="${esc(x.id)}" ${!x.shared?'checked':''}><div><b>${esc(x.vessel)} · ${esc(x.kind)}</b><small>${esc(x.summary)} · ${date(x.when)}</small><small>${x.shared?'Previously exported':'Not yet exported'}</small></div></div>`).join('')||'<div class="empty">No changes recorded yet.</div>'}</div>${button('Export selected updates','exportChanges()','primary')}${button('Import colleague’s update',"go('transfer');setTimeout(()=>$('importFile').click(),100)")}${help('Sharing procedure','<p>1. Save a budget or supply record. 2. Select changes here. 3. Export a transfer file. 4. Share it through an authorized channel. 5. Your partner imports it using Handover. The app preserves conflicts as review copies.</p>')}</section>`}
function exportChanges(){const ids=[...document.querySelectorAll('.sharecheck:checked')].map(e=>e.value),changes=db.changeLog.filter(x=>ids.includes(x.id));if(!changes.length){alert('Select at least one change');return}const bid=new Set(changes.filter(x=>x.kind==='Budget').map(x=>x.recordId)),sid=new Set(changes.filter(x=>x.kind==='Supply').map(x=>x.recordId));const vessels=[...new Set(changes.map(x=>x.vessel))];const payload={format:'maran-toolbox-handover',schemaVersion:1,exportedAt:now(),source:'Maran Toolbox Pro - selected changes',vessels,records:[],projects:[],notes:[],budgets:db.budgets.filter(x=>bid.has(x.id)),supplies:db.supplies.filter(x=>sid.has(x.id)),changeLog:changes};download('Maran_Selected_Updates_'+new Date().toISOString().slice(0,10)+'.mtb',JSON.stringify(payload));changes.forEach(x=>x.shared=true);save();render()}

$('importFile').addEventListener('change',readImport);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
